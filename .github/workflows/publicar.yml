name: publicar
# Manual (reserva). O agendamento roda no servidor do CRM (cron a cada 5 min, ver README).
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o que venceu
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
        run: node publicar.mjs run
      - name: Registrar o que saiu
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicados.json log.txt)" ]; then
            git config user.name "publicador-crmdojordao"
            git config user.email "matheus@emploia.com.br"
            git add publicados.json log.txt
            git commit -m "publicados: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
            echo "nao consegui gravar o registro" && exit 1
          fi
